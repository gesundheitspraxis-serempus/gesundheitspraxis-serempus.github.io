<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="/#willkommen" aria-label="Willkommen">
      <img class="brand-logo" src="/assets/images/logo_full.webp" alt="Gesundheits Praxis – Logo" width="789" height="411" fetchpriority="high" decoding="async">
    </a>
    <div class="brand-text">
      <h1 class="site-title">Gesundheits Praxis</h1>
      <p class="site-subtitle">Désirée Serempus</p>
    </div>
    <button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="site-nav" role="navigation" aria-label="Hauptnavigation">
      <ul>
        <li><a href="/#willkommen">Willkommen</a></li>
        <li><a href="/#therapie">Therapie</a></li>
        <li><a href="/#angebot">Angebot</a></li>
        <li><a href="/#kosten">Kosten</a></li>
        <li><a href="/#ueber-mich">Über mich</a></li>
        <li><a href="/#kurse">Kurse</a></li>
        <li><a href="/#kontakt">Kontakt</a></li>
      </ul>
    </nav>
  </div>
  <div class="slogan-bar">
    <p class="site-slogan">
      <span>Diese Website soll eine Einladung sein.</span>
      <span class="slogan-sep" aria-hidden="true">·</span>
      <span>Zu einem ersten inneren Gespräch.</span>
      <span class="slogan-sep" aria-hidden="true">·</span>
      <span>Und vielleicht auch zu einem persönlichen.</span>
    </p>
  </div>
</header>
<script>
  (function() {
    const menuToggle = document.querySelector('.menu-toggle');
    const siteNav = document.querySelector('.site-nav');
    if (!menuToggle || !siteNav) return;

    menuToggle.addEventListener('click', function() {
      const open = this.classList.toggle('active');
      siteNav.classList.toggle('active');
      this.setAttribute('aria-expanded', open);
    });

    siteNav.addEventListener('click', function(event) {
      if (event.target.closest('a')) {
        menuToggle.classList.remove('active');
        siteNav.classList.remove('active');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
